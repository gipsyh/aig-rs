[package]
name = "aig"
version = "0.5.0"
license = "MIT"
description = "Aig library in Rust"
edition = "2024"
repository = "https://github.com/gipsyh/aig-rs"
authors = ["Yuheng Su <gipsyh.icu@gmail.com>"]
keywords = ["aig", "hardware", "model_checking"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
logicrs = { path = "../logicrs", version = "0.6.0" }
giputils = { path = "../giputils", version = "0.3.5" }

[profile.release]
lto = true
panic = "abort"
strip = true
